    <script>
        function Wyslij(){
            let poleTekstowe = document.getElementById('tekst');
            let tekstWiadomosci = poleTekstowe.value.trim(); //trim usuwa białe znaki

            if (tekstWiadomosci){
                let chat = document.getElementById('chat');

                let nowaWiadomosc = document.createElement('section');
                nowaWiadomosc.className = 'Jolanta';

                let obraz = document.createElement('img');
                obraz.src = 'Jolka.jpg';

                let wypowiedz = document.createElement('p');
                wypowiedz.textContent = tekstWiadomosci;

                nowaWiadomosc.appendChild(obraz);
                nowaWiadomosc.appendChild(wypowiedz);

                chat.appendChild(nowaWiadomosc);

                poleTekstowe.value = '';

                chat.scrollTop = chat.scrollHeight;
                
            }
        }

}
